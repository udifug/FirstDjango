{% extends 'base.html' %}
{% load static %}

{% block title %}
    Добавить новый товар
{% endblock %}

{% block style %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'css/add_item.css' %}">
{% endblock %}

{% block content %}
    <div class="form-wrapper">
    <form action="{% url 'item-add' %}" method="POST">
    {% csrf_token %}
        <h2><label>Добавить новый товар</label><br></h2>
        <label>Название</label><br>
        <input type="text" name="name"><br>
        <label>Бренд</label><br>
        <input type="text" name="brand"><br>
        <label>Количество</label><br>
        <input type="number" name="count" min="0" ><br>
        <label>Описание товара</label><br>
        <textarea name="description" cols="40" rows="5"></textarea><br>
        <input type="submit" value="Добавить товар">
    </form>
    </div>
{% endblock %}
